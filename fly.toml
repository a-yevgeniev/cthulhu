# Deploys packages/server (the shared-table backend) to Fly.io. The build context is this
# repo root — npm workspaces need packages/engine and packages/protocol alongside
# packages/server, so the Dockerfile can't live (and build) in isolation inside that folder.
#
# Live at https://coc7-server.fly.dev (deployed 2026-08-28). Redeploy with:
#   flyctl deploy --remote-only
# (--remote-only because this dev machine's local Docker daemon isn't running; Fly's remote
# builder needs no local Docker at all).
app = "coc7-server"
primary_region = "iad"

[build]
  dockerfile = "packages/server/Dockerfile"

[env]
  PORT = "4000"
  COC7_DB_PATH = "/data/coc7-table.sqlite"
  COC7_CORS_ORIGIN = "https://a-yevgeniev.github.io"

[[mounts]]
  source = "coc7_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
